<body>
<style>
/* Diseño: una columna de trabajo (máx. 780 px). En escritorio, barra lateral fija; en el móvil, pestañas abajo.
   Paleta: índigo de teñido (aizome) sobre papel frío, ámbar kihada para los puntos y la racha, y una pizarra de
   tinta para el código en los dos temas. Tipos: Zen Kaku Gothic New (títulos), IBM Plex Sans (texto), Plex Mono (código). */
:root {
  --papel: #F1F3F8; --superficie: #FFFFFF; --hundido: #E8ECF4; --tinta: #131A2C; --tinta-2: #4A5470; --tinta-3: #5A6482; --linea: #D7DDEA;
  --ai: #2B4C9B; --ai-fuerte: #1D3778; --ai-suave: #E2E8F7; --sobre-ai: #FFFFFF;
  --kihada: #835400; --kihada-vivo: #D99A12; --kihada-suave: #FBF0D4;
  --bien: #2C7548; --bien-suave: #DFF0E5; --mal: #AE3828; --mal-suave: #F8E2DD;
  --pizarra: #131B30; --pizarra-borde: #131B30; --pz-texto: #E4E8F4; --pz-tenue: #7F8BAB; --pz-kw: #98B6FF; --pz-str: #F3C677; --pz-num: #F6A486; --pz-fn: #8FE0C0; --pz-com: #6F7B9C; --pz-sel: #22304F;
  --f-titulo: "Zen Kaku Gothic New", "Hiragino Sans", "Segoe UI", system-ui, sans-serif;
  --f-texto: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-codigo: "IBM Plex Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
  --r: 10px; --r-g: 16px; --sombra: 0 1px 2px rgba(19, 26, 44, .06), 0 4px 16px rgba(19, 26, 44, .05);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --papel: #0B1020; --superficie: #131A2D; --hundido: #0F1528; --tinta: #E6EAF4; --tinta-2: #A7AFC7; --tinta-3: #8A93AE; --linea: #252F49;
  --ai: #8FA9F2; --ai-fuerte: #B6C8FF; --ai-suave: #1B2646; --sobre-ai: #0B1020;
  --kihada: #F0B540; --kihada-vivo: #F0B540; --kihada-suave: #2C2513;
  --bien: #66C792; --bien-suave: #13291D; --mal: #F2826F; --mal-suave: #351A1A;
  --pizarra: #0D1325; --pizarra-borde: #29345A; --pz-sel: #1E2A48; --sombra: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --papel: #0B1020; --superficie: #131A2D; --hundido: #0F1528; --tinta: #E6EAF4; --tinta-2: #A7AFC7; --tinta-3: #8A93AE; --linea: #252F49;
  --ai: #8FA9F2; --ai-fuerte: #B6C8FF; --ai-suave: #1B2646; --sobre-ai: #0B1020;
  --kihada: #F0B540; --kihada-vivo: #F0B540; --kihada-suave: #2C2513;
  --bien: #66C792; --bien-suave: #13291D; --mal: #F2826F; --mal-suave: #351A1A;
  --pizarra: #0D1325; --pizarra-borde: #29345A; --pz-sel: #1E2A48; --sombra: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--papel); color: var(--tinta); font: 15px/1.55 var(--f-texto); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--papel); }
h1, h2, h3 { font-family: var(--f-titulo); font-weight: 700; line-height: 1.2; text-wrap: balance; margin: 0; letter-spacing: .01em; }
p { margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
a { color: var(--ai); }
.mono { font-family: var(--f-codigo); }
.etiqueta { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; font-weight: 600; color: var(--tinta-3); }
.tenue { color: var(--tinta-2); }
.num { font-variant-numeric: tabular-nums; }

/* Estructura */
.app { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
.lateral { display: none; }
.cabecera { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--papel); border-bottom: 1px solid var(--linea);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 12px; }
.marca { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--tinta); }
.sello { width: 34px; height: 34px; border-radius: 8px; background: var(--ai); color: var(--sobre-ai); display: grid; place-items: center; font: 900 19px/1 var(--f-titulo); }
.marca b { font: 700 16px/1.1 var(--f-titulo); display: block; }
.marca small { font-size: 11.5px; color: var(--tinta-3); }
.cabecera .rango-mini { margin-left: auto; }
.principal { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 110px; min-width: 0; }
.columna { max-width: 780px; margin: 0 auto; display: grid; gap: 16px; min-width: 0; }
.pestanas { position: fixed; inset: auto 0 0 0; z-index: 25; background: var(--superficie); border-top: 1px solid var(--linea);
  display: grid; grid-template-columns: repeat(7, 1fr); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.pestanas a, .lateral nav a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 2px 9px; color: var(--tinta-3); text-decoration: none; font-size: 11.5px; font-weight: 500; }
.pestanas a[aria-current="page"], .lateral nav a[aria-current="page"] { color: var(--ai); }
.pestanas svg, .lateral nav svg { width: 22px; height: 22px; }
@media (min-width: 900px) {
  .app { grid-template-columns: 236px 1fr; }
  .cabecera, .pestanas { display: none; }
  .lateral { display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh; padding: 22px 16px; border-right: 1px solid var(--linea); background: var(--superficie); }
  .lateral nav { display: grid; gap: 2px; }
  .lateral nav a { flex-direction: row; gap: 12px; font-size: 14.5px; padding: 9px 12px; border-radius: 8px; color: var(--tinta-2); }
  .lateral nav a:hover { background: var(--hundido); }
  .lateral nav a[aria-current="page"] { background: var(--ai-suave); color: var(--ai-fuerte); font-weight: 600; }
  .lateral .pie { margin-top: auto; font-size: 12.5px; color: var(--tinta-3); }
  .principal { padding-block: 26px 48px; }
}

/* Piezas */
.tarjeta { background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--r-g); padding: 18px; display: grid; gap: 12px; align-content: start; min-width: 0; }
.fila { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.entre { display: flex; justify-content: space-between; gap: 12px; align-items: center; flex-wrap: wrap; }
.btn { border: 1px solid var(--linea); background: var(--superficie); border-radius: 999px; padding: 9px 16px; font-weight: 500; line-height: 1.2; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: var(--tinta-3); }
.btn.primario { background: var(--ai); border-color: var(--ai); color: var(--sobre-ai); font-weight: 600; }
.btn.primario:hover { background: var(--ai-fuerte); border-color: var(--ai-fuerte); }
.btn.grande { padding: 13px 22px; font-size: 16px; }
.btn.chico { padding: 6px 12px; font-size: 13.5px; }
.btn.plano { border-color: transparent; background: transparent; color: var(--ai); padding-inline: 8px; }
.btn[disabled] { opacity: .45; cursor: default; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--linea); background: var(--superficie); border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 500; color: var(--tinta-2); }
.chip[aria-pressed="true"], .chip[aria-selected="true"] { background: var(--tinta); color: var(--papel); border-color: var(--tinta); }
.insignia { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--hundido); color: var(--tinta-2); }
.insignia.bien { background: var(--bien-suave); color: var(--bien); }
.insignia.ai { background: var(--ai-suave); color: var(--ai-fuerte); }
.insignia.kihada { background: var(--kihada-suave); color: var(--kihada); }
select.campo, input.campo, textarea.campo { border: 1px solid var(--linea); background: var(--superficie); border-radius: 8px; padding: 8px 10px; max-width: 100%; }
.barra { height: 8px; border-radius: 99px; background: var(--hundido); overflow: hidden; }
.barra > i { display: block; height: 100%; background: var(--ai); border-radius: 99px; transition: width .4s ease; }
.barra.kihada > i { background: var(--kihada-vivo); }
.barra.bien > i { background: var(--bien); }

/* Cinturón de kyū */
.cinturon { display: inline-block; width: 46px; height: 12px; border-radius: 3px; position: relative; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .18); vertical-align: middle; }
.cinturon::after { content: ""; position: absolute; right: 7px; top: -2px; bottom: -2px; width: 6px; border-radius: 2px; background: inherit; filter: brightness(.82); box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .18); }
.rango-mini { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; min-width: 0; }
.emblema { display: inline-grid; flex: none; line-height: 0; }
.emblema svg { display: block; }
.rango-texto { display: grid; line-height: 1.2; min-width: 0; }
.rango-nombre { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rango-texto small { font-size: 11.5px; color: var(--tinta-3); font-weight: 500; }
.lateral .rango-mini { flex-wrap: wrap; row-gap: 8px; }
.lateral .rango-mini .rango-texto { flex: 1 1 calc(100% - 50px); }
.lateral .rango-mini .barra { flex: 1 1 calc(100% - 80px); order: 3; height: 6px; }
.lateral .rango-mini .insignia { order: 4; }
@media (max-width: 520px) { .cabecera .marca > span:not(.sello) { display: none; } }
.insignia.mal { background: var(--mal-suave); color: var(--mal); }

/* Bandas de espera y foco */
.banda { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); z-index: 15; border-radius: var(--r-g); padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; box-shadow: var(--sombra); }
@media (min-width: 900px) { .banda { top: 12px; } }
.banda.espera { background: var(--ai); color: var(--sobre-ai); }
.banda.foco { background: var(--tinta); color: var(--papel); }
.banda .reloj { font: 600 22px/1 var(--f-codigo); font-variant-numeric: tabular-nums; }
.banda .texto { flex: 1 1 180px; min-width: 0; font-size: 14px; }
.banda .btn { border-color: currentColor; background: transparent; color: inherit; }
.banda .btn.lleno { background: var(--superficie); color: var(--tinta); border-color: var(--superficie); }
.pulso { width: 9px; height: 9px; border-radius: 50%; background: currentColor; animation: pulso 1.6s ease-in-out infinite; }
@keyframes pulso { 50% { opacity: .25; } }

/* Hoy */
.portada { background: var(--ai); color: var(--sobre-ai); border-radius: var(--r-g); padding: 22px 20px; display: grid; gap: 14px; position: relative; overflow: hidden; }
.portada h1 { font-size: clamp(24px, 5vw, 32px); font-weight: 900; }
.portada p { max-width: 52ch; opacity: .92; }
.portada .btn.primario { background: var(--sobre-ai); color: var(--ai-fuerte); border-color: var(--sobre-ai); justify-self: start; }
.portada .kanji { position: absolute; right: -6px; bottom: -34px; font: 900 150px/1 var(--f-titulo); opacity: .1; pointer-events: none; }
.metricas { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.metrica { background: var(--superficie); border: 1px solid var(--linea); border-radius: var(--r); padding: 12px; display: grid; gap: 6px; min-width: 0; }
.metrica b { font: 700 24px/1 var(--f-titulo); font-variant-numeric: tabular-nums; }
.metrica small { color: var(--tinta-2); font-size: 12.5px; }
@media (max-width: 640px) { .metricas { grid-template-columns: 1fr 1fr; } }
.portada .btn.secundario { background: transparent; color: var(--sobre-ai); border-color: rgba(255, 255, 255, .6); }
.portada .btn.secundario:hover { border-color: var(--sobre-ai); }
/* Rango */
.cabeza-rango { display: flex; gap: 14px; align-items: center; }
.puntos-grandes { font: 700 22px/1 var(--f-titulo); }
.desplegable > summary, details > summary { cursor: pointer; font-weight: 600; color: var(--ai); }
details[open] > summary { margin-bottom: 12px; }
details.desplegable[open] { display: grid; gap: 14px; }
.escalera { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.escalera li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 7px 10px; border-radius: 10px; }
.escalera li.actual { background: var(--kihada-suave); box-shadow: inset 0 0 0 1.5px var(--kihada-vivo); }
.escalera li.actual .num { color: var(--kihada); font-weight: 700; }
.escalera li.futuro .emblema { opacity: .5; filter: grayscale(.5); }
.escalera .detalle { display: grid; min-width: 0; }
.escalera small { font-size: 12.5px; }
.tabla-puntos { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 720px) { .tabla-puntos { grid-template-columns: 1.35fr 1fr; } }
.tabla-puntos ul { list-style: none; margin: 6px 0 8px; padding: 0; display: grid; }
.tabla-puntos li { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; border-bottom: 1px solid var(--linea); padding: 6px 0; }
.tabla-puntos li b { text-align: right; white-space: nowrap; }
@media (max-width: 420px) { .tabla-puntos li { flex-direction: column; gap: 0; } .tabla-puntos li b { text-align: left; } }
.tabla-puntos b.mas { color: var(--kihada); } .tabla-puntos b.menos { color: var(--mal); }
.celebra .emblema { animation: aparecer-rango .55s cubic-bezier(.2, .9, .3, 1.3) .05s both; }
@keyframes aparecer-rango { from { transform: scale(.35) rotate(-25deg); opacity: 0; } }
.sello-en { display: inline-grid; place-items: center; width: 86px; height: 86px; border-radius: 22px; background: var(--ai); color: var(--sobre-ai); font: 900 34px/1 var(--f-titulo); }
/* Inglés */
.portada-en { position: relative; overflow: hidden; }
.portada-en h1 { font-size: clamp(24px, 5vw, 30px); font-weight: 900; }
.portada-en > * { position: relative; }
.portada-en::after { content: "EN"; position: absolute; right: 8px; top: -14px; font: 900 120px/1 var(--f-titulo); color: var(--ai); opacity: .08; pointer-events: none; }
.estado-voz { font-size: 12.5px; }
.btn.oir { padding: 6px 10px; }
.btn.oir.grande { padding: 11px 18px; font-size: 15.5px; background: var(--ai-suave); border-color: var(--ai-suave); color: var(--ai-fuerte); font-weight: 600; }
.palabra-grande { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.en-grande { font: 700 32px/1.15 var(--f-titulo); overflow-wrap: anywhere; }
.es-grande { font: 700 22px/1.3 var(--f-titulo); }
.frase-en { font-size: 18px; font-weight: 600; line-height: 1.4; }
.texto-opcion { font-size: 15.5px; overflow-wrap: anywhere; min-width: 0; }
.fichas { display: flex; flex-wrap: wrap; gap: 8px; }
.ficha { border: 1.5px solid var(--linea); background: var(--superficie); border-radius: 10px; padding: 8px 13px; font-size: 16px; font-weight: 500; }
.ficha:hover:not([disabled]) { border-color: var(--ai); }
.armado.fichas-armadas { display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; align-items: center; }
.armado.fichas-armadas:empty::before { content: "Toca las palabras en el orden correcto"; }
.respuesta.casi { background: var(--kihada-suave); }
.respuesta.casi h3 { color: var(--kihada); }
.palabras-dichas { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: 18px; font-weight: 600; }
.palabras-dichas .bien { color: var(--bien); }
.palabras-dichas .mal { color: var(--mal); text-decoration: underline wavy; text-underline-offset: 4px; }
.microfono { display: inline-flex; align-items: center; gap: 10px; border: 0; border-radius: 999px; padding: 13px 22px; font-weight: 600; font-size: 16px; background: var(--ai); color: var(--sobre-ai); }
.microfono:hover { background: var(--ai-fuerte); }
.microfono.escuchando { background: var(--mal); animation: late 1.3s ease-in-out infinite; }
@keyframes late { 50% { box-shadow: 0 0 0 9px var(--mal-suave); } }
.pila-mic { display: grid; gap: 8px; justify-items: start; }
.oyendo { font-style: italic; color: var(--tinta-2); }
.respuesta-en { width: 100%; font-size: 16px; resize: vertical; }
.interruptor { display: inline-flex; gap: 8px; align-items: center; font-size: 13.5px; color: var(--tinta-2); cursor: pointer; }
.interruptor input { width: 18px; height: 18px; accent-color: var(--ai); margin: 0; }
.palabras { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); }
.palabra { border: 1px solid var(--linea); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 2px; align-content: start; }
.palabra b { font-size: 16.5px; }
.frases { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.frases li { display: grid; gap: 2px; padding-bottom: 10px; border-bottom: 1px solid var(--linea); }
.frases li:last-child { border-bottom: 0; padding-bottom: 0; }
.errores-en { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 12px; }
.errores-en li { display: grid; gap: 4px; }
.errores-en code { font-size: 13.5px; background: var(--hundido); padding: 5px 8px; border-radius: 6px; overflow-wrap: anywhere; justify-self: start; }
.chat { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.burbuja { max-width: 88%; padding: 10px 12px; border-radius: 14px; display: grid; gap: 4px; justify-items: start; }
.burbuja.ella { background: var(--hundido); border-bottom-left-radius: 4px; justify-self: start; }
.burbuja.yo { background: var(--ai-suave); justify-self: end; border-bottom-right-radius: 4px; }
.burbuja.yo.bien { background: var(--bien-suave); } .burbuja.yo.mal { background: var(--mal-suave); }
.burbuja .quien { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-3); font-weight: 600; }
.burbuja > span[lang] { font-size: 16px; }
.chat .nota { font-size: 13.5px; color: var(--tinta-2); text-align: center; padding: 0 10px; }
.correccion { color: var(--kihada); font-size: 13.5px; }
.pista-chat { background: var(--kihada-suave); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; }
.entrada-chat .campo { flex: 1 1 200px; min-width: 0; }
/* Examen */
.opcion[aria-pressed="true"] { border-color: var(--ai); background: var(--ai-suave); box-shadow: inset 0 0 0 1px var(--ai); }
.tarjeta > .btn { justify-self: start; }
.codigo li.elegida { background: rgba(143, 169, 242, .28); box-shadow: inset 3px 0 0 var(--pz-kw); }
.escalera small.requisito, .escalera small.sabe-rango { color: var(--tinta-3); font-size: 12px; }
/* Escribir como en papel: sin colores, letra de máquina, renglones suaves */
